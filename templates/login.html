<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login – Apps Localization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Login to Apps Localization to translate and edit images." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.5s ease, color 0.3s ease;
    }
    body.light { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #333; }
    body.dark  { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #e6e6e6; }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
      transition: background 0.4s ease, color 0.4s ease, box-shadow 0.3s ease;
    }
    body.dark .card { background: rgba(30, 32, 44, 0.95); color: #e6e6e6; box-shadow: 0 12px 28px rgba(0,0,0,0.6); }
    h1 { text-align: center; margin-bottom: 1rem; font-weight: 700; font-size: clamp(1.5rem, 5vw, 2rem); color: #111; }
    body.dark h1 { color: #f0f0f0; }
    label { display: block; margin-top: 1rem; font-weight: 600; font-size: clamp(0.9rem, 2.5vw, 1rem); color: #333; }
    body.dark label { color: #e0e0e0; }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 0.8rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      transition: border 0.2s, box-shadow 0.2s;
    }
    input[type="email"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 6px rgba(0,123,255,0.35);
    }
    body.dark input[type="email"], body.dark input[type="password"] {
      background: #2a2d3a;
      color: #e0e0e0;
      border: 1px solid #555;
    }
    body.dark input[type="email"]:focus, body.dark input[type="password"]:focus {
      border-color: #00c6ff;
      box-shadow: 0 0 6px rgba(0,198,255,0.35);
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: #fff;
      padding: 0.7rem;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }
    body.dark button {
      background: linear-gradient(135deg, #1a2a3d, #2c5364);
      border: 1px solid #444;
    }
    body.dark button:hover {
      box-shadow: 0 8px 18px rgba(0,0,0,0.5);
    }
    .oauth-buttons {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 0.7rem;
      font-weight: 600;
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      text-decoration: none;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .oauth-btn.google { background: #4285F4; color: #fff; }
    .oauth-btn.github { background: #24292e; color: #fff; }
    .oauth-btn img {
      width: 20px;
      height: 20px;
      margin-right: 0.5rem;
    }
    .oauth-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    body.dark .oauth-btn { background: #2a2d3a; color: #e0e0e0; border: 1px solid #555; }
    body.dark .oauth-btn.google { background: #4285F4; }
    body.dark .oauth-btn.github { background: #24292e; }
    .switch { text-align: center; margin-top: 1rem; font-size: clamp(0.85rem, 2.5vw, 1rem); }
    .switch a { color: #4facfe; font-weight: 600; text-decoration: none; }
    .switch a:hover { text-decoration: underline; }
    #theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #theme-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    }
    .flash {
      text-align: center;
      margin: 0.5rem 0;
      font-weight: 600;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
    }
    .flash.error { color: #ff6b6b; }
    .flash.success { color: #007bff; }
    body.dark .flash.error { color: #ff6b6b; }
    body.dark .flash.success { color: #00c6ff; }
  </style>
</head>
<body class="light">
  <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  <main class="card">
    <h1>Login</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <p class="flash {{ category }}" role="alert">{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" required aria-label="Email address" />
      <label for="password">Password</label>
      <input type="password" name="password" id="password" required aria-label="Password" />
      <button type="submit">Login</button>
    </form>
    <div class="oauth-buttons">
      <a href="{{ url_for('google_login') }}" class="oauth-btn google" aria-label="Login with Google">
        <img src="https://www.google.com/favicon.ico" alt="Google logo"> Login with Google
      </a>
      <a href="{{ url_for('github_login') }}" class="oauth-btn github" aria-label="Login with GitHub">
        <img src="https://github.githubassets.com/favicons/favicon.png" alt="GitHub logo"> Login with GitHub
      </a>
    </div>
    <p class="switch">Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></p>
  </main>
  <script>
    const body = document.body;
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      body.classList.replace('light', 'dark');
      themeToggle.textContent = '☀️';
    }
    themeToggle.addEventListener('click', () => {
      if (body.classList.contains('light')) {
        body.classList.replace('light', 'dark');
        localStorage.setItem('theme', 'dark');
        themeToggle.textContent = '☀️';
      } else {
        body.classList.replace('dark', 'light');
        localStorage.setItem('theme', 'light');
        themeToggle.textContent = '🌙';
      }
    });
  </script>
</body>
</html>
