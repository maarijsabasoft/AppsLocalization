<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image and Text Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.18.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const App = () => {
      const [activeTab, setActiveTab] = useState('imageText');
      const canvasRef = useRef(null);
      const [canvas, setCanvas] = useState(null);
      const [image, setImage] = useState(null);
      const [textInput, setTextInput] = useState('');
      const [charCount, setCharCount] = useState(0);
      const [targetResolution, setTargetResolution] = useState({ width: 1920, height: 1080 });
      const [selectedLanguage, setSelectedLanguage] = useState('en');
      const [scale, setScale] = useState(1);

      const languages = [
        { code: 'en', name: 'English' },
        { code: 'es', name: 'Spanish' },
        { code: 'fr', name: 'French' },
        { code: 'de', name: 'German' },
        { code: 'zh', name: 'Chinese' },
      ];

      // Initialize canvas for Image Text Translation and Resolution Setter
      useEffect(() => {
        if ((activeTab === 'imageText' || activeTab === 'resolution') && canvasRef.current) {
          const newCanvas = new fabric.Canvas(canvasRef.current, {
            width: 600,
            height: 400,
            backgroundColor: '#ffffff',
          });
          setCanvas(newCanvas);
          return () => newCanvas.dispose();
        }
      }, [activeTab]);

      // Handle image upload
      const handleImageUpload = (e, tab) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.src = reader.result;
            img.onload = () => {
              setImage(img);
              const maxWidth = Math.min(window.innerWidth * 0.9, 600);
              const newScale = Math.min(maxWidth / img.width, 1);
              setScale(newScale);
              canvas.setDimensions({
                width: img.width * newScale,
                height: img.height * newScale,
              });
              const fabricImg = new fabric.Image(img, {
                scaleX: newScale,
                scaleY: newScale,
                selectable: false,
              });
              canvas.add(fabricImg);
              canvas.renderAll();
              if (tab === 'imageText') {
                initImageTextCanvas(newCanvas, img, newScale);
              } else if (tab === 'resolution') {
                adjustResolution(img, newScale);
              }
            };
          };
          reader.readAsDataURL(file);
        }
      };

      // Initialize Image Text Translation canvas (based on provided code)
      const initImageTextCanvas = (canvas, img, scale) => {
        const fonts = ['Inter', 'Arial', 'Times New Roman'];
        const saveState = () => {
          // Simplified save state (can be expanded as needed)
        };
        const reconstructTexts = () => {
          // Simplified text reconstruction (can be expanded as needed)
        };
        const updateControls = () => {
          const activeObjects = canvas.getActiveObjects();
          if (activeObjects.length === 1 && activeObjects[0].type === 'textbox') {
            const obj = activeObjects[0];
            document.getElementById('fontFamily').value = obj.fontFamily || 'Inter';
            document.getElementById('fontSize').value = Math.round(obj.fontSize / scale) || 20;
            document.getElementById('fill').value = obj.fill || '#000000';
          } else {
            document.getElementById('fontFamily').value = 'Inter';
            document.getElementById('fontSize').value = 20;
            document.getElementById('fill').value = '#000000';
          }
        };

        canvas.on('selection:created', updateControls);
        canvas.on('selection:updated', updateControls);
        canvas.on('selection:cleared', updateControls);

        document.getElementById('addText').addEventListener('click', () => {
          const newText = new fabric.Textbox('New Text', {
            left: 50 * scale,
            top: 50 * scale,
            fontFamily: 'Inter',
            fontSize: 20 * scale,
            fill: '#000000',
            width: 200 * scale,
            selectable: true,
            editable: true,
          });
          canvas.add(newText);
          canvas.setActiveObject(newText);
          updateControls();
          canvas.renderAll();
          saveState();
          reconstructTexts();
        });

        document.getElementById('fontFamily').addEventListener('change', (e) => {
          const activeObjects = canvas.getActiveObjects();
          activeObjects.forEach(obj => {
            if (obj.type === 'textbox') {
              obj.set('fontFamily', e.target.value);
              obj.set('dirty', true);
            }
          });
          canvas.requestRenderAll();
          saveState();
          reconstructTexts();
        });

        document.getElementById('fontSize').addEventListener('input', (e) => {
          const activeObjects = canvas.getActiveObjects();
          activeObjects.forEach(obj => {
            if (obj.type === 'textbox') {
              obj.set('fontSize', parseInt(e.target.value) * scale);
              obj.set('dirty', true);
            }
          });
          canvas.requestRenderAll();
          saveState();
          reconstructTexts();
        });

        document.getElementById('fill').addEventListener('input', (e) => {
          const activeObjects = canvas.getActiveObjects();
          activeObjects.forEach(obj => {
            if (obj.type === 'textbox') {
              obj.set('fill', e.target.value);
              obj.set('dirty', true);
            }
          });
          canvas.requestRenderAll();
          saveState();
          reconstructTexts();
        });
      };

      // Handle text translation with character limits
      const handleTextTranslation = () => {
        const today = new Date().toDateString();
        const storedData = JSON.parse(localStorage.getItem('translationData') || '{}');
        const dailyCount = storedData[today] || 0;
        if (dailyCount + textInput.length > 500) {
          alert('Daily character limit of 500 exceeded.');
          return;
        }
        if (textInput.length > 100) {
          alert('Input exceeds 100 character limit.');
          return;
        }
        // Simulate translation (replace with actual API call if available)
        const translatedText = `Translated to ${selectedLanguage}: ${textInput}`;
        storedData[today] = dailyCount + textInput.length;
        localStorage.setItem('translationData', JSON.stringify(storedData));
        setCharCount(storedData[today]);
        alert(translatedText);
      };

      // Adjust image resolution
      const adjustResolution = (img, scale) => {
        const { width, height } = targetResolution;
        const multiplier = Math.min(width / img.width, height / img.height);
        canvas.setDimensions({ width: img.width * multiplier, height: img.height * multiplier });
        const fabricImg = new fabric.Image(img, {
          scaleX: multiplier,
          scaleY: multiplier,
          selectable: false,
        });
        canvas.clear();
        canvas.add(fabricImg);
        canvas.renderAll();
      };

      // Download canvas as image
      const saveCanvas = () => {
        if (!canvas) return;
        const multiplier = targetResolution.width / canvas.width;
        const dataURL = canvas.toDataURL({ format: 'png', multiplier });
        const link = document.createElement('a');
        link.download = 'edited_image.png';
        link.href = dataURL;
        link.click();
      };

      return (
        <div className="min-h-screen bg-gray-100">
          <header className="bg-blue-600 text-white p-4">
            <h1 className="text-2xl font-bold">Image and Text Editor</h1>
          </header>
          <div className="container mx-auto p-4">
            <div className="flex border-b border-blue-200">
              <button
                className={`px-4 py-2 font-semibold ${activeTab === 'imageText' ? 'bg-blue-500 text-white' : 'bg-white text-blue-600'} rounded-t-md`}
                onClick={() => setActiveTab('imageText')}
              >
                Image Text Translation
              </button>
              <button
                className={`px-4 py-2 font-semibold ${activeTab === 'textTranslation' ? 'bg-blue-500 text-white' : 'bg-white text-blue-600'} rounded-t-md`}
                onClick={() => setActiveTab('textTranslation')}
              >
                Text Translation
              </button>
              <button
                className={`px-4 py-2 font-semibold ${activeTab === 'resolution' ? 'bg-blue-500 text-white' : 'bg-white text-blue-600'} rounded-t-md`}
                onClick={() => setActiveTab('resolution')}
              >
                Resolution Setter
              </button>
            </div>
            <div className="bg-white p-6 rounded-b-md shadow-md">
              {activeTab === 'imageText' && (
                <div>
                  <h2 className="text-xl font-semibold text-blue-600 mb-4">Image Text Translation</h2>
                  <input
                    type="file"
                    accept="image/*"
                    className="mb-4"
                    onChange={(e) => handleImageUpload(e, 'imageText')}
                  />
                  <div className="mb-4">
                    <label className="block text-blue-600 mb-1">Font Family</label>
                    <select id="fontFamily" className="border border-blue-200 p-2 rounded">
                      <option value="Inter">Inter</option>
                      <option value="Arial">Arial</option>
                      <option value="Times New Roman">Times New Roman</option>
                    </select>
                  </div>
                  <div className="mb-4">
                    <label className="block text-blue-600 mb-1">Font Size</label>
                    <input id="fontSize" type="number" defaultValue="20" className="border border-blue-200 p-2 rounded w-20" />
                  </div>
                  <div className="mb-4">
                    <label className="block text-blue-600 mb-1">Text Color</label>
                    <input id="fill" type="color" defaultValue="#000000" className="border border-blue-200 p-1 rounded" />
                  </div>
                  <div className="flex space-x-4 mb-4">
                    <button id="addText" className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Add Text</button>
                    <button onClick={saveCanvas} className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Download</button>
                  </div>
                  <canvas id="canvas" ref={canvasRef} className="border border-blue-200"></canvas>
                </div>
              )}
              {activeTab === 'textTranslation' && (
                <div>
                  <h2 className="text-xl font-semibold text-blue-600 mb-4">Text Translation</h2>
                  <div className="mb-4">
                    <label className="block text-blue-600 mb-1">Select Language</label>
                    <select
                      value={selectedLanguage}
                      onChange={(e) => setSelectedLanguage(e.target.value)}
                      className="border border-blue-200 p-2 rounded"
                    >
                      {languages.map(lang => (
                        <option key={lang.code} value={lang.code}>{lang.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="mb-4">
                    <label className="block text-blue-600 mb-1">Enter Text (Max 100 characters)</label>
                    <textarea
                      value={textInput}
                      onChange={(e) => setTextInput(e.target.value.slice(0, 100))}
                      className="border border-blue-200 p-2 rounded w-full"
                      rows="4"
                    ></textarea>
                    <p className="text-blue-600">Characters used today: {charCount}/500</p>
                  </div>
                  <button
                    onClick={handleTextTranslation}
                    className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                  >
                    Translate
                  </button>
                </div>
              )}
              {activeTab === 'resolution' && (
                <div>
                  <h2 className="text-xl font-semibold text-blue-600 mb-4">Resolution Setter</h2>
                  <input
                    type="file"
                    accept="image/*"
                    className="mb-4"
                    onChange={(e) => handleImageUpload(e, 'resolution')}
                  />
                  <div className="mb-4">
                    <label className="block text-blue-600 mb-1">Target Width</label>
                    <input
                      type="number"
                      value={targetResolution.width}
                      onChange={(e) => setTargetResolution({ ...targetResolution, width: parseInt(e.target.value) })}
                      className="border border-blue-200 p-2 rounded w-32"
                    />
                  </div>
                  <div className="mb-4">
                    <label className="block text-blue-600 mb-1">Target Height</label>
                    <input
                      type="number"
                      value={targetResolution.height}
                      onChange={(e) => setTargetResolution({ ...targetResolution, height: parseInt(e.target.value) })}
                      className="border border-blue-200 p-2 rounded w-32"
                    />
                  </div>
                  <button
                    onClick={() => adjustResolution(image, scale)}
                    className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                  >
                    Set Resolution
                  </button>
                  <button
                    onClick={saveCanvas}
                    className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 ml-4"
                  >
                    Download
                  </button>
                  <canvas id="canvas" ref={canvasRef} className="border border-blue-200 mt-4"></canvas>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
